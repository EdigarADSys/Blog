<!DOCTYPE html>
<html>
<head>
    <title>Chat Pessoal</title>
    <link rel="icon" type="image/x-icon" href="/IA/ico/favicon2.ico"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chatbot pessoal do Edigar. Faça perguntas sobre ele!">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="chatbot-container">
        <h2><i class="fas fa-robot"></i> Olá! Posso te ajudar com perguntas sobre o Edigar!</h2>
        <div id="resposta"></div>
        <div id="perguntas-predefinidas">
            <button data-pergunta="Edigar está em qual periodo da faculdade?" aria-label="Pergunta pré-definida: Edigar está em qual periodo da faculdade?">Edigar está em qual periodo da faculdade?</button>
            <button data-pergunta="Onde ele mora?" aria-label="Pergunta pré-definida: Onde ele mora?">Onde ele mora?</button>
            <button data-pergunta="Quais os hobbies dele?" aria-label="Pergunta pré-definida: Quais os hobbies dele?">Quais os hobbies dele?</button>
            <button data-pergunta="Onde ele se vê daqui a cinco anos?" aria-label="Pergunta pré-definida: Onde ele se vê a daqui a cinco anos?">Onde ele se vê daqui a cinco anos?</button>
            <button data-pergunta="Quais são suas habilidades técnicas?" aria-label="Pergunta pré-definida: Quais são suas habilidades técnicas?">Quais são suas habilidades técnicas?</button>
        </div>
    </div>
    <script src="chatbot.js"></script>
    <script src="https://unpkg.com/compromise"></script>
</body>
</html>
